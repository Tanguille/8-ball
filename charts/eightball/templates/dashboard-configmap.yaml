{{- /* A template, not common's configMaps: those render values with tpl, which would break the {{verdict}} legends. */}}
{{- if .Values.grafanaDashboards.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    grafana_dashboard: "1"
data:
  eightball.json: |-
    {{- .Files.Get "dashboards/eightball.json" | nindent 4 }}
{{- end }}
