[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "8ball"
path = "src/main.rs"

[dependencies]
backend = { workspace = true }
domain = { workspace = true }
service = { workspace = true }
store = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
reqwest = { workspace = true }
rmcp = { workspace = true, features = ["transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util"] }
toml = { workspace = true }
wiremock = { workspace = true }
