# Added by models.sh when the host has no real GPU (no /dev/dri, or only a virtual display, as on CI runners): the
# Vulkan image then runs on its CPU backend, and no device is passed through.
services:
  d3: { devices: !reset [] }
  embed: { devices: !reset [] }
  rerank: { devices: !reset [] }
  chat: { devices: !reset [] }
  big: { devices: !reset [] }
