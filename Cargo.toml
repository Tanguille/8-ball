[workspace]
members = ["domain", "store", "backend", "service", "cli", "bench"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unnecessary_self_imports = "warn"
assert_is_empty = "allow"
# Internal crates only: per-function error and panic docs add nothing.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
backend = { path = "backend" }
domain = { path = "domain" }
service = { path = "service" }
store = { path = "store" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = "4.6.7"
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
# Only the record reader, for the benchmark datasets: Snappy-compressed parquet files.
parquet = { version = "60.1.0", default-features = false, features = ["snap"] }
prometheus-client = "0.25.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = "3.8.0"
# The version rmcp re-exports, so JsonSchema stays one trait across crates.
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
# JSON keeps key order everywhere: states and questions hash their serialized text.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.20"
toml = { version = "1.1.8", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
