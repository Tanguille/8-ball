# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shell
            tool: aqua:ewhauser/shuck aqua:mvdan/sh
            run: git ls-files -z '*.sh' | xargs -0 shuck check && git ls-files -z '*.sh' | xargs -0 shfmt -d
          - name: hadolint
            tool: aqua:hadolint/hadolint
            run: hadolint Dockerfile
          - name: zizmor
            tool: aqua:zizmorcore/zizmor
            run: zizmor --format=github .github/workflows
          - name: markdown
            tool: npm:markdownlint-cli2
            run: markdownlint-cli2 '**/*.md'
          - name: helm
            tool: aqua:helm/helm
            run: |
              # A fresh runner has no Helm repos, and dependency build only downloads from added ones.
              helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
              helm dependency build charts/eightball
              helm lint charts/eightball
          - name: gitleaks
            tool: aqua:gitleaks/gitleaks
            run: gitleaks git --redact --verbose
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the full history.
          fetch-depth: ${{ matrix.name == 'gitleaks' && '0' || '1' }}
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # Save from main only; PR-scoped copies crowd the Actions cache quota.
          cache_save: ${{ github.event_name == 'push' }}
          install_args: ${{ matrix.tool }}
      - env:
          # zizmor's online audits (impostor commits, known-vulnerable actions) query the GitHub API.
          GH_TOKEN: ${{ github.token }}
        run: ${{ matrix.run }}
