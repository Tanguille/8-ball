# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Benchmark (Logfare)

# Large and hosted models through Logfare, next to d3 on the runner's CPU. Needs the LOGFARE_API_KEY secret.
# - 27b: d3, Qwen3.8 27B and the d3-then-27B cascade, on main pushes and nightly. It fails when a task gets
#   worse than the last passing run by more than 1% of its cases.
# - matrix: every Logfare model that can answer a decision question, weekly. It reports and never fails.
# Pull requests never run this: secrets do not reach fork PRs, and the PR gate is in ci.yaml.
on:
  push:
    # TEMPORARY: full runs from the PR branch before merging; revert before merge.
    branches: [main, ci/bench]
    paths:
      # Quoted: a leading * starts a YAML alias.
      - "*/src/**"
      - "*/Cargo.toml"
      - Cargo.lock
      - dev/**
      - .github/workflows/bench-logfare.yaml
  schedule:
    - cron: "23 3 * * 1-6" # 27b, every night but Sunday
    - cron: "23 3 * * 0" # matrix, Sunday
  workflow_dispatch:
    inputs:
      run:
        type: choice
        options: [27b, matrix]
        default: 27b
      accept:
        description: Save this run as the new baseline, also when it got worse (after an intended change)
        type: boolean
        default: false

permissions:
  contents: read

# Both runs share one Logfare rate limit, so they queue instead of overlapping.
concurrency:
  group: logfare
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    env:
      LOGFARE_API_KEY: ${{ secrets.LOGFARE_API_KEY }}
      # TEMPORARY: this commit's branch push runs the matrix; revert before merge.
      MODE: ${{ (github.ref == 'refs/heads/ci/bench' || github.event.schedule == '23 3 * * 0' || inputs.run == 'matrix') && 'matrix' || '27b' }}
      ACCEPT: ${{ inputs.accept == true }}
    steps:
      - name: Check the key
        run: |
          if [ -z "$LOGFARE_API_KEY" ]; then
            echo "::error::Add the LOGFARE_API_KEY repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/8ball-models
          key: models-${{ hashFiles('dev/compose.yaml') }}
      - run: dev/models.sh up
      - run: cargo build --release -p cli -p bench
      # The free tier allows 1,000 requests an hour: the 27b run takes about 560 at 30 a minute, the matrix
      # about 280 per model at 16 a minute.
      - name: Logfare endpoints
        run: |
          if [ "$MODE" = matrix ]; then
            dev/logfare.sh 16 > logfare.toml
            echo "PER_SIDE=50" >> "$GITHUB_ENV"
          else
            dev/logfare.sh 30 qwen-3.8-27b > logfare.toml
            echo "PER_SIDE=100" >> "$GITHUB_ENV"
          fi
          endpoints=$(sed -n 's/^\[endpoints\.\(.*\)\]$/\1/p' logfare.toml | paste -sd,)
          echo "ENDPOINTS=d3,$endpoints" >> "$GITHUB_ENV"
          echo "Logfare endpoints: $endpoints"
      # The last saved run of this mode is the baseline.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: baseline
          key: logfare-${{ env.MODE }}-${{ github.run_id }}
          restore-keys: logfare-${{ env.MODE }}-
      - name: Benchmark
        id: bench
        run: |
          args=(--endpoints "$ENDPOINTS" --cascade "d3,lf-qwen-3-8-27b" --per-side "$PER_SIDE" --config logfare.toml)
          # The matrix compares with d3, which always runs; a model that cannot answer this week is skipped.
          if [ "$MODE" = matrix ]; then
            args+=(--skip-unavailable --reference d3)
          else
            args+=(--reference lf-qwen-3-8-27b)
          fi
          if [ -f baseline/summary.json ] && [ "$ACCEPT" != true ]; then
            args+=(--baseline baseline/summary.json)
          fi
          set +e
          cargo run --release -p bench -- "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p baseline && cp target/bench/summary.json baseline/
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != 0 ] && [ "$MODE" = matrix ]; then
            echo "::warning::A Logfare model got worse than last week; see the job summary."
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
      # The saved run of this mode is the next baseline. A failing 27b run skips this save, so a regression
      # stays red until it is fixed or accepted; the matrix run only warns, so it always advances its baseline.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: baseline
          key: logfare-${{ env.MODE }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ env.MODE }}
          path: target/bench/*.json
