# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

# Every PR and main push: the checks from AGENTS.md, the live tests, and the benchmark gate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run

  # The pinned dev models on the runner's CPU (dev/models.sh falls back to CPU without /dev/dri).
  models:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # About 4.3 GB; the key changes with the pinned model URLs in compose.yaml.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/8ball-models
          key: models-${{ hashFiles('dev/compose.yaml') }}
      - run: dev/models.sh up
      - run: cargo nextest run --test live --run-ignored only
      - run: cargo build --release -p cli -p bench
      # Fails when a task gets worse than bench/baseline.json by more than 1% of its cases. A PR that changes
      # verdicts on purpose updates the baseline from this job's summary.json artifact. Qwen3.5 0.8B only reports:
      # it flipped 20 of 600 verdicts between CPU and GPU, so its counts move between runner CPUs.
      - name: Benchmark
        run: |
          set -o pipefail
          cargo run --release -p bench -- --endpoints d3,rerank,chat --reference d3 --per-side 100 --report-only chat \
            --baseline bench/baseline.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: target/bench/*.json
