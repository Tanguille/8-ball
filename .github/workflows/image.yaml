# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Container image

# Every main push that changes code or the chart is a release: image, Helm chart and GitHub release share one version.
on:
  push:
    branches: [main]
    paths:
      # Quoted: a leading * starts a YAML alias.
      - "*/src/**"
      - "*/Cargo.toml"
      - store/migrations/**
      - Cargo.toml
      - Cargo.lock
      - Dockerfile
      - .dockerignore
      - charts/**
      # The image does not contain the bench crate. A bench dependency bump still releases, because it also changes
      # Cargo.lock.
      - "!bench/**"
  # Edits to this file do not release: an action bump would ship the same image. Run it by hand after a pipeline fix.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  # Never cancel a release halfway: the version is only claimed by the final tag, but the pushed image and chart are not rolled back.
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/tanguille/8-ball:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false
      # Every release bumps the patch version. A v* tag on HEAD that is not fully published (a hand-made minor or major
      # bump, or a run that failed after the tag) is published as is. Overlapping main runs queue in the concurrency group.
      - name: Version
        id: version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next=$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n1)
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=v0.1.0
          elif [ -z "$next" ]; then
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v$major.$minor.$((patch + 1))"
          elif gh release view "$next" > /dev/null 2>&1 && docker manifest inspect "ghcr.io/tanguille/8-ball:$next" > /dev/null 2>&1; then
            # The image tag is pushed last, so it proves the whole release finished.
            echo "$next is already released"
            exit 0
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
      # Helm from .mise.toml, so its version is pinned once.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.version.outputs.version
        with:
          install_args: aqua:helm/helm
          cache: false
      - name: Package chart
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A fresh runner has no Helm repos, and dependency build only downloads from added ones.
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          helm dependency build charts/eightball
          helm lint charts/eightball
          helm package charts/eightball --version "${VERSION#v}" --app-version "$VERSION" --destination "$RUNNER_TEMP/chart"
      - name: Build
        run: docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE" .
      - name: Smoke test
        run: dev/image-smoke.sh "$IMAGE"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        run: |
          docker push "$IMAGE"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      # The tag comes first: if GitHub refuses it (the 403 seen on 2026-11-18, -21, -25 and -26), nothing is published
      # under a version that has no tag. The untagged sha image above is already pushed by then. A re-run on a tagged
      # HEAD reuses the release.
      - name: Release
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$VERSION" > /dev/null 2>&1 || gh release create "$VERSION" --target "$GITHUB_SHA" --generate-notes
      - name: Publish chart
        if: steps.version.outputs.version
        # helm push reuses the docker/login-action credentials.
        run: helm push "$RUNNER_TEMP"/chart/eightball-*.tgz oci://ghcr.io/tanguille/charts
      # Last, because the Version step treats the version image tag as proof that the release is complete.
      - name: Publish latest and version
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for tag in latest ${VERSION:+"$VERSION"}; do
            docker tag "$IMAGE" "ghcr.io/tanguille/8-ball:$tag"
            docker push "ghcr.io/tanguille/8-ball:$tag"
          done
