# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Benchmark (hosted)

# Large and hosted models through a hosted provider, next to d3 on the runner's CPU. Needs the HOSTED_API_KEY secret and the HOSTED_URL variable.
# - 27b: d3, Qwen3.8 27B and the d3-then-27B cascade, on main pushes and nightly. It fails when an endpoint
#   has over 1% call errors, or a task gets worse than the last passing run by more than 1% of its cases.
# - matrix: every hosted model that can answer a decision question, weekly. It reports and never fails.
# Pull requests never run this: secrets do not reach fork PRs, and the PR gate is in ci.yaml.
on:
  push:
    branches: [main]
    paths:
      # Quoted: a leading * starts a YAML alias.
      - "*/src/**"
      - "*/Cargo.toml"
      - Cargo.toml
      - Cargo.lock
      - store/migrations/**
      - dev/**
      - .github/workflows/bench-hosted.yaml
  schedule:
    - cron: "23 3 * * 1-6" # 27b, every night but Sunday
    - cron: "23 3 * * 0" # matrix, Sunday
  workflow_dispatch:
    inputs:
      run:
        type: choice
        options: [27b, matrix]
        default: 27b
      accept:
        description: Save this run as the new baseline, also when it got worse (after an intended change)
        type: boolean
        default: false

permissions:
  contents: read

# Both runs share one hosted rate limit, so they queue instead of overlapping.
concurrency:
  group: hosted
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MODE: ${{ (github.event.schedule == '23 3 * * 0' || inputs.run == 'matrix') && 'matrix' || '27b' }}

jobs:
  bench:
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    outputs:
      skipped: ${{ steps.endpoints.outputs.skipped || steps.bench.outputs.skipped }}
    env:
      HOSTED_API_KEY: ${{ secrets.HOSTED_API_KEY }}
      HOSTED_URL: ${{ vars.HOSTED_URL }}
      # Our own joke model and router ids (they contain a slash) cannot answer a decision question. The variable replaces this.
      HOSTED_SKIP: ${{ vars.HOSTED_SKIP || '^8ball$|/' }}
      ACCEPT: ${{ inputs.accept == true }}
    steps:
      - name: Check the key
        run: |
          if [ -z "$HOSTED_API_KEY" ] || [ -z "$HOSTED_URL" ]; then
            echo "::error::Add the HOSTED_API_KEY secret and the HOSTED_URL variable (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Keyed on the model URLs only, as in ci.yaml.
      - id: models
        run: echo "key=$(grep -o 'https://huggingface[^"]*' dev/compose.yaml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/8ball-models
          key: models-${{ steps.models.outputs.key }}
          restore-keys: models-
      - run: cargo build --release -p cli -p bench
      - run: dev/models.sh up
      # A provider's free tier can allow 1,000 requests an hour: the 27b run takes about 560 at 30 a minute, the matrix
      # about 280 per model at 16 a minute.
      # A provider outage, or a model missing from its list tonight, is not a regression in 8-ball: the run is skipped
      # with a warning instead of failing, and the later steps (baseline save, publish) follow the skip.
      - name: Hosted endpoints
        id: endpoints
        run: |
          skip() {
            echo "::warning::$1; skipping the hosted benchmark."
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$MODE" = matrix ]; then
            dev/hosted.sh 16 > hosted.toml || skip "The provider's model list failed"
            echo "PER_SIDE=50" >> "$GITHUB_ENV"
            echo "BASELINE_PREFIX=hosted-matrix" >> "$GITHUB_ENV"
          else
            dev/hosted.sh 30 qwen-3.8-27b > hosted.toml || skip "The provider's model list failed"
            echo "PER_SIDE=100" >> "$GITHUB_ENV"
            # Start with a fresh baseline because older runs could save one despite excessive errors.
            echo "BASELINE_PREFIX=hosted-27b-reliable" >> "$GITHUB_ENV"
          fi
          endpoints=$(sed -n 's/^\[endpoints\.\(.*\)\]$/\1/p' hosted.toml | paste -sd,)
          [ -n "$endpoints" ] || skip "The provider lists no usable model"
          echo "ENDPOINTS=d3,$endpoints" >> "$GITHUB_ENV"
          echo "Hosted endpoints: $endpoints"
      # The last saved run of this mode is the baseline.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: baseline
          key: ${{ env.BASELINE_PREFIX }}-${{ github.run_id }}
          restore-keys: ${{ env.BASELINE_PREFIX }}-
      - name: Benchmark
        id: bench
        if: env.SKIP != 'true'
        run: |
          # The default shell has no pipefail: without it, the status of tee would hide a bench failure.
          set -o pipefail
          args=(--endpoints "$ENDPOINTS" --cascade "d3,hosted-qwen-3-8-27b" --per-side "$PER_SIDE" --config hosted.toml)
          # The matrix compares with d3, which always runs; a model that cannot answer this week is skipped.
          if [ "$MODE" = matrix ]; then
            args+=(--skip-unavailable --reference d3)
          else
            args+=(--reference hosted-qwen-3-8-27b --require-reliable)
          fi
          if [ -f baseline/summary.json ] && [ "$ACCEPT" != true ]; then
            args+=(--baseline baseline/summary.json)
          fi
          # A provider that is down fails the doctor probe within seconds, before any request counts: retry twice,
          # then skip. Any other failure (error limit, regression) is real and keeps failing the run.
          for attempt in 1 2 3; do
            status=0
            cargo run --release -p bench -- "${args[@]}" 2> bench.err | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
            cat bench.err >&2
            if [ "$status" = 0 ] || [ "$MODE" = matrix ] || ! grep -q 'failed its doctor probe' bench.err; then break; fi
            [ "$attempt" = 3 ] || sleep 120
          done
          if [ "$status" != 0 ] && [ "$MODE" != matrix ] && grep -q 'failed its doctor probe' bench.err; then
            echo "::warning::The provider failed its doctor probe three times; skipping the hosted benchmark."
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" != 0 ] && [ "$MODE" = matrix ]; then
            echo "::warning::A hosted model got worse than last week; see the job summary."
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
          mkdir -p baseline && cp target/bench/summary.json baseline/
      # The saved run of this mode is the next baseline. A failing 27b run skips this save, so a regression
      # stays red until it is fixed or accepted; the matrix run only warns, so it always advances its baseline.
      - if: env.SKIP != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: baseline
          key: ${{ env.BASELINE_PREFIX }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ env.MODE }}
          path: |
            target/bench/*.json
            target/bench/page.md

  # Saves the tables on the bench-results branch (see docs/benchmark.md). The job has no secret. A failing 27b run
  # skips it, so a regression never replaces the page.
  publish:
    needs: bench
    if: github.ref == 'refs/heads/main' && needs.bench.outputs.skipped != 'true'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          dev/publish-bench.sh "bench-$MODE" "$MODE.md" \
            "d3 ran on the CPU of the GitHub runner. The other models ran at a hosted provider, so their times include the network and the rate limit. Compare accuracy between rows, not time."
